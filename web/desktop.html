<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ThreeKip</title>
  <link rel="stylesheet" href="/web/desktop.css" />
</head>
<body>
  <!-- ============ DESKTOP / LIBRARY ============ -->
  <div id="desktop" class="view">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"/>
        </svg>
        <span class="brand-name">ThreeKip</span>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Ajustes" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <div class="controls">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Buscar proyectos" autocomplete="off" />
      </div>
      <button class="icon-btn" id="sortBtn" title="Ordenar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5h10M11 9h7M11 13h4M3 17l3 3 3-3M6 4v16"/>
        </svg>
      </button>
    </div>

    <div class="tabs" id="filterTabs">
      <button class="tab active" data-filter="all">Proyectos</button>
      <button class="tab" data-filter="recent">Recientes</button>
      <button class="tab" data-filter="favorites">Favoritos</button>
      <button class="tab" data-filter="shared">Compartidos</button>
      <button class="tab" data-filter="trash">Papelera</button>
    </div>

    <main class="content">
      <div id="projectGrid" class="grid"></div>
      <div id="emptyState" class="empty hidden">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        </svg>
        <p id="emptyText">No hay proyectos aquí.</p>
        <div class="empty-actions">
          <button class="btn btn-primary" id="emptyNew">Nuevo proyecto</button>
          <button class="btn btn-secondary" id="emptyImport">Importar</button>
        </div>
      </div>
    </main>

    <button class="fab" id="newFab" title="Nuevo dibujo" aria-label="Nuevo dibujo">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>

    <input id="importInput" type="file" accept="application/json,.sk3d" class="hidden" />
  </div>

  <!-- ============ EDITOR ============ -->
  <div id="editor" class="view hidden">
    <div class="editor-topbar">
      <button class="icon-btn" id="backBtn" title="Volver">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
      <span class="editor-title" id="editorTitle">Sin título</span>
      <div class="spacer"></div>
      <div class="tool-group">
        <button class="tool-btn active" data-tool="draw" title="Dibujar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        </button>
        <button class="tool-btn" data-tool="erase" title="Borrar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3a1.7 1.7 0 0 1 0-2.4l9.6-9.6a1.7 1.7 0 0 1 2.4 0l4.3 4.3a1.7 1.7 0 0 1 0 2.4L13 21z"/><path d="M22 21H7M5 13l6 6"/></svg>
        </button>
        <button class="tool-btn" data-tool="select" title="Seleccionar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 7.07 17 2.51-7.39L20 10.07z"/></svg>
        </button>
      </div>
      <div class="tool-group">
        <button class="icon-btn" id="undoBtn" title="Deshacer">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
        </button>
        <button class="icon-btn" id="redoBtn" title="Rehacer">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg>
        </button>
      </div>
      <div class="tool-group">
        <button class="icon-btn" id="perspBtn" title="Perspectiva/Ortho">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 6-9 6-9-6z"/><path d="m3 9 9 6 9-6M3 15l9 6 9-6"/></svg>
        </button>
        <button class="icon-btn" id="axisBtn" title="Ejes">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg>
        </button>
      </div>
      <div class="tool-group">
        <button class="btn btn-primary btn-sm" id="saveBtn">Guardar</button>
        <button class="icon-btn" id="exportPngBtn" title="Exportar PNG">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        </button>
        <button class="icon-btn" id="exportGlbBtn" title="Exportar GLB">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        </button>
      </div>
    </div>
    <div class="engine-host">
      <iframe id="engineFrame" src="/engine/" title="ThreeKip Engine"></iframe>
      <div id="engineLoading" class="engine-loading">
        <div class="spinner"></div>
        <p>Cargando motor 3D…</p>
      </div>
    </div>
  </div>

  <!-- ============ SHEET (options / rename) ============ -->
  <div id="sheetBackdrop" class="backdrop hidden">
    <div class="sheet">
      <div class="sheet-title" id="sheetTitle">Opciones</div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/web/desktop.js"></script>
</body>
</html>
