name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        id: eas_build
        run: |
          eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --json > eas-output.json
          cat eas-output.json
          BUILD_ID=$(jq -r '.id' eas-output.json)
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Wait for build and download artifact
        if: always()
        run: |
          BUILD_ID="${{ steps.eas_build.outputs.build_id }}"
          if [ -n "$BUILD_ID" ] && [ "$BUILD_ID" != "null" ] && [ "$BUILD_ID" != "" ]; then
            echo "Build ID: $BUILD_ID"
            # Poll for completion
            for i in {1..60}; do
              eas build:view "${BUILD_ID}" --json > build-info.json 2>/dev/null || true
              STATUS=$(jq -r '.status' build-info.json 2>/dev/null || echo "unknown")
              echo "Build status: $STATUS"
              if [ "$STATUS" = "finished" ] || [ "$STATUS" = "errored" ] || [ "$STATUS" = "canceled" ]; then
                break
              fi
              sleep 60
            done
            eas build:view "${BUILD_ID}" --json > build-info.json
            cat build-info.json
            ARTIFACT_URL=$(jq -r '.artifacts.buildUrl' build-info.json 2>/dev/null)
            if [ "$ARTIFACT_URL" != "null" ] && [ -n "$ARTIFACT_URL" ] && [ "$ARTIFACT_URL" != "" ]; then
              curl -L "$ARTIFACT_URL" -o app-debug.apk
              echo "APK downloaded successfully"
            else
              echo "No artifact URL found or build failed"
              cat build-info.json
            fi
          else
            echo "No build ID available"
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}