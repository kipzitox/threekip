name: Secret scan

# Escanea toda la historia en cada push y pull request para que un secreto no
# se quede dentro de un commit. Usa las reglas por defecto de gitleaks mas la
# lista de falsos positivos conocidos de .gitleaks.toml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan history for leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full history
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --exit-code 1
